<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QorTrade - Institutional Unlisted & Pre-IPO Equities Desk</title>
  <meta name="description" content="Access India's premier pre-IPO, unlisted shares, and unicorn equities through bank-grade escrow settlements and verified CDSL/NSDL transfers." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- =========================================================================
       Site Header (QorTrade Production-Grade Header)
       ========================================================================= -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <!-- QorTrade Brand Identity -->
        <a href="#stocks" class="brand-logo" onclick="window.switchTab('stocks')">
          <div class="brand-icon-glyph">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <circle cx="12" cy="12" r="9"/>
              <path d="M14.5 9.5L9.5 14.5M14.5 9.5H10.5M14.5 9.5V13.5"/>
            </svg>
          </div>
          <div class="brand-text-wrap">
            <span class="brand-title">QorTrade</span>
            <span class="brand-tagline">Private Equities Desk</span>
          </div>
        </a>

        <!-- Capsule Navigation (Overview pill style like reference image) -->
        <nav class="nav-menu">
          <a href="#stocks" class="nav-link active" data-tab="stocks">Overview</a>
          <a href="#about" class="nav-link" data-tab="about">About Desk</a>
          <a href="#faq" class="nav-link" data-tab="faq">FAQ</a>
        </nav>

        <!-- Right Side Utility Cluster -->
        <div class="header-right">
          <div class="market-pulse-chip" title="Off-Market Depository Desk is Operational">
            <span class="pulse-dot-green"></span>
            <span>Desk Live</span>
          </div>

          <button class="theme-toggle-btn" id="theme-toggle" aria-label="Toggle Dark/Light Mode" title="Toggle Theme">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </button>

          <!-- User Profile Capsule (Reference: Billy Cragrowsky style) -->
          <div class="user-profile-pill" onclick="window.openEnquiry('msei')" title="Institutional Trading Account">
            <div class="user-avatar-circle">PK</div>
            <div class="user-meta-text">
              <span class="user-name">Prathmesh K.</span>
              <span class="user-role-label">Verified Investor</span>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--text-muted); margin-left: 2px;"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- =======================================================================
         PAGE 1: Stocks Dashboard & Catalog
         ======================================================================= -->
    <section class="page-view active" id="stocks-view">
      <div class="container">
        <!-- Dashboard Subheader Bar -->
        <div class="platform-subheader">
          <div class="platform-title-group">
            <h1>Market Directory</h1>
            <p>Pre-IPO issues, private equity blocks, and vetted growth unicorns.</p>
          </div>

          <div class="platform-controls-bar">
            <div class="platform-tabs">
              <button class="platform-tab-btn active" data-category="live">Live Equities</button>
              <button class="platform-tab-btn" data-category="upcoming">Upcoming Unicorns</button>
              <button class="platform-tab-btn" data-category="all">All Issues</button>
            </div>

            <!-- Pill Search Bar -->
            <div class="search-wrapper">
              <svg class="search-icon-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input type="text" class="pill-search-input" id="search-input" placeholder="Search company, ISIN, sector..." autocomplete="off" />

</section></main></body></html>
